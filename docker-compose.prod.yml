# VPS / multi-tenant production — behind an existing reverse proxy.
# No host ports exposed. Connect your proxy (nginx, Caddy, Traefik, etc.)
# to the external network defined below.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# The proxy container should be attached to the same external network
# and forward to:
#   - http://frontend:80   (SPA)
#   - http://backend:8000  (API)

services:
  frontend:
    ports: []                          # no direct host access

  backend:
    environment:
      - CORS_ORIGINS=https://your-domain.com

networks:
  myace:
    # Attach an existing proxy network so the reverse proxy can reach
    # frontend:80 and backend:8000 by container name.
    # Override via .env: PROXY_NETWORK=my_proxy_network
    name: ${PROXY_NETWORK:-myace-proxy}
    external: true
