# Preserve a real upstream proxy's X-Forwarded-Proto (e.g. nginx-proxy-manager
# terminating TLS in front of this container) instead of always overwriting it
# with this container's own $scheme, which is plain "http" on every request
# since this nginx never terminates TLS itself. Falls back to $scheme when
# nothing set the header (e.g. this container is the direct edge listener, as
# in the base docker-compose.yml single-machine setup).
map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name myace.localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS resolver — required for runtime DNS resolution
    # when using variables in proxy_pass (see /api/ location below).
    resolver 127.0.0.11 valid=10s;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:8765 http://127.0.0.1:8765; form-action 'self'; base-uri 'self';" always;

    # index.html is the SPA shell that references content-hashed asset
    # filenames (e.g. /assets/index-XXXX.js). Those hashed assets are safe
    # to cache indefinitely, but index.html itself must never be served
    # stale — a cached shell keeps pointing at a JS bundle that may no
    # longer exist (or worse, still exists but contains an already-fixed
    # bug) after every subsequent deploy, since nothing else ever prompts
    # the browser to refetch it. no-cache forces revalidation on every
    # load without disabling caching outright (a 304 still returns fast).
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Use a variable for proxy_pass to force runtime DNS resolution.
    # Without this, nginx resolves "backend" at startup and caches the IP —
    # if the backend container is recreated (e.g. during deploy), it gets a
    # new IP and nginx 502s until restarted.
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }
}
