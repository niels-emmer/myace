# Preserve a real upstream proxy's X-Forwarded-Proto (e.g. nginx-proxy-manager
# terminating TLS in front of this container) instead of always overwriting it
# with this container's own $scheme, which is plain "http" on every request
# since this nginx never terminates TLS itself. Falls back to $scheme when
# nothing set the header (e.g. this container is the direct edge listener, as
# in the base docker-compose.yml single-machine setup).
map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name myace.localhost;
    # Don't advertise the nginx version in responses or error pages.
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS resolver — required for runtime DNS resolution
    # when using variables in proxy_pass (see /api/ location below).
    resolver 127.0.0.11 valid=10s;

    # Declared explicitly (M-3) so the deployed limit is intentional and
    # reviewable rather than inherited from nginx's implicit 1 MB default —
    # that default was, before this, the only thing standing between an
    # oversized body and the backend. It must be >= the backend's largest
    # per-route cap (app/main.py's BULK_IMPORT_REQUEST_BODY_MAX_BYTES, 10 MB)
    # or bulk import would be rejected here before the app ever sees it.
    # Per-route enforcement is the backend's MaxBodySizeMiddleware; this is
    # only the coarse outer bound. The backend's own default cap (1 MB) is
    # what applies to every other route.
    client_max_body_size 10m;

    # Security headers — see security-headers.conf for why this is an include
    # that's repeated inside the locations below.
    include /etc/nginx/security-headers.conf;

    # index.html is the SPA shell that references content-hashed asset
    # filenames (e.g. /assets/index-XXXX.js). Those hashed assets are safe
    # to cache indefinitely, but index.html itself must never be served
    # stale — a cached shell keeps pointing at a JS bundle that may no
    # longer exist (or worse, still exists but contains an already-fixed
    # bug) after every subsequent deploy, since nothing else ever prompts
    # the browser to refetch it. no-cache forces revalidation on every
    # load without disabling caching outright (a 304 still returns fast).
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Use a variable for proxy_pass to force runtime DNS resolution.
    # Without this, nginx resolves "backend" at startup and caches the IP —
    # if the backend container is recreated (e.g. during deploy), it gets a
    # new IP and nginx 502s until restarted.
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }

    # Liveness probe for the web UI: the landing page only advertises the MCP
    # endpoint when this answers (frontend/src/lib/mcp.ts). Proxied through the
    # loopback-only helper server below, which owns the variable lookup of the
    # opt-in `mcp` service: nginx writes *resolver* failures to the server's
    # error log, ignoring a location-level `error_log`, so a deployment without
    # the profile would otherwise log an error on every visitor. The helper's
    # log is discarded; an absent service is a quiet 502 here.
    location = /mcp/health {
        access_log off;
        proxy_pass http://127.0.0.1:81/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }

    # MyACE MCP server (ADR-0018) — public, read-only, anonymous. Served on the
    # site's own hostname rather than a new one, so the public URL, TLS
    # certificate and DNS record are the ones that already exist; the
    # nginx-proxy-manager host in front of this container needs no change
    # because it forwards every path here.
    #
    # When the `mcp` compose profile is not running, the name `mcp` does not
    # resolve and this location returns 502 — the rest of the site is
    # unaffected. `proxy_buffering off` because a client may open a streaming
    # response even though this server answers with plain JSON.
    location /mcp {
        set $mcp_upstream http://mcp:8001;
        proxy_pass $mcp_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}

# Loopback-only helper for the /mcp/health probe (see that location). It is a
# separate server block only so its `error_log` can hide the expected resolver
# failure: a variable `proxy_pass` to the opt-in `mcp` service logs an error
# when that service is not running, and nginx attributes those resolver errors
# to the server, not the location. Never exposed — 127.0.0.1 inside this
# container is reachable by nothing else.
server {
    listen 127.0.0.1:81;
    server_name _;
    access_log off;
    error_log /dev/null crit;

    resolver 127.0.0.11 valid=10s;

    location = /health {
        set $mcp_health_upstream http://mcp:8001/health;
        proxy_pass $mcp_health_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
