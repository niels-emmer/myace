# Security headers, included at server level AND inside every location that
# sets its own add_header. nginx does not inherit server-level add_header
# directives into a location that declares any add_header of its own, so
# without repeating these there (location = /index.html, /assets/) the SPA
# shell and bundles were served with no CSP or X-Frame-Options at all.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "0" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:8765 http://127.0.0.1:8765; form-action 'self'; base-uri 'self';" always;
