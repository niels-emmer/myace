# Base stack — frontend nginx proxies /api/* to the backend.
# Publishes NO host ports by itself: layer docker-compose.dev.yml (publishes
# :80 and :8000) or docker-compose.prod.yml (behind a reverse proxy), or add
# your own `ports: ["80:80"]` override for the frontend service. See
# docs/deployment.md.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: myace-backend
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - CORS_ORIGINS=http://localhost
    volumes:
      - ./backend:/app
      # Starter-pack content read by seed_starter_collections() on boot —
      # read-only, present in both dev and prod (this is the base compose
      # file, included by both overrides).
      - ./collections:/app/collections:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - myace

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: myace-frontend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - myace

  # Public, read-only MCP server (ADR-0018). Opt-in: a self-hoster who does not
  # want a public MCP surface never runs it, and the frontend's `location /mcp`
  # simply 502s for that path. Enable with `--profile mcp` — see
  # docs/deployment.md. It has no database, no credentials and no write path;
  # it reads the backend's anonymous routes over this private network.
  mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    container_name: myace-mcp
    restart: unless-stopped
    profiles: ["mcp"]
    environment:
      # No `env_file`: this container needs none of the stack's secrets.
      - MCP_BACKEND_URL=http://backend:8000
      # A link a human can open; the backend URL above is internal-only.
      - MCP_SITE_URL=${FRONTEND_BASE_URL:-}
      # DNS-rebinding protection is on; the public Host must be allow-listed
      # or every request 421s. Keep the defaults for local/container access.
      - MCP_ALLOWED_HOSTS=${MCP_ALLOWED_HOSTS:-localhost:*,127.0.0.1:*,myace-mcp:*}
      - MCP_ALLOWED_ORIGINS=${MCP_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
    expose:
      - "8001"
    depends_on:
      - backend
    networks:
      - myace

  postgres:
    image: postgres:16-alpine
    container_name: myace-postgres
    restart: unless-stopped
    expose:
      - "5432"
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-myace}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-myace_secret}
      - POSTGRES_DB=${POSTGRES_DB:-myace}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myace} -d ${POSTGRES_DB:-myace}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - myace

  postgres-backup:
    image: prodrigestivill/postgres-backup-local:16
    container_name: myace-postgres-backup
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB:-myace}
      - POSTGRES_USER=${POSTGRES_USER:-myace}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-myace_secret}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - myace

volumes:
  postgres-data:

networks:
  myace:
    driver: bridge
