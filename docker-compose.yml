# Single-machine production — everything behind a single host.
# Accessible at http://localhost:80
# Frontend nginx proxies /api/* to the backend.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: myace-backend
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - CORS_ORIGINS=http://localhost
    volumes:
      - ./backend:/app
      # Starter-pack content read by seed_starter_collections() on boot —
      # read-only, present in both dev and prod (this is the base compose
      # file, included by both overrides).
      - ./collections:/app/collections:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - myace

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: myace-frontend
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - myace

  postgres:
    image: postgres:16-alpine
    container_name: myace-postgres
    expose:
      - "5432"
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-myace}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-myace_secret}
      - POSTGRES_DB=${POSTGRES_DB:-myace}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myace} -d ${POSTGRES_DB:-myace}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - myace

volumes:
  postgres-data:

networks:
  myace:
    driver: bridge
