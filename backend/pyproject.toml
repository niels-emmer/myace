[project]
name = "myace-backend"
version = "1.10.0"
description = "MyACE — My Agentic Coding Environment Backend API"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.22",
    "alembic>=1.13.0",
    "pydantic-settings>=2.5.0",
    "authlib>=1.3.0",
    "pyjwt>=2.9.0",
    "gitpython>=3.1.43",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "python-multipart>=0.0.12",
    "bcrypt>=4.2.0",
    "pyotp>=2.9.0",
    "itsdangerous>=2.2.0",
    "pyyaml>=6.0.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.0",
    "greenlet>=3.0.0",
    "aiosmtplib>=3.0.0",
    "cryptography>=43.0.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.30.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "aiosqlite>=0.20.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# E712: SQLAlchemy filter expressions like `Collection.is_active == True` are not
# Python booleans — they build a SQL comparison via operator overloading, and
# `is True`/bare-column truthiness (ruff's suggested fix) would silently break
# every query using this pattern. Keep `== True`/`== False` in SQLAlchemy .where().
ignore = ["E711", "E712"]

[tool.ruff.lint.per-file-ignores]
# Test files: long function signatures with type annotations are acceptable
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
