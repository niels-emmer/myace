[project]
name = "myace-cli"
version = "0.1.0"
description = "MyACE CLI — Sync agentic coding environment profiles to your local machine"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.6.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]
serve = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
myace = "myace_cli.main:app"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
