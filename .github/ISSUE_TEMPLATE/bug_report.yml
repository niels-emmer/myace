name: Bug Report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out as much
        of this as you can — it makes triage much faster.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Backend (API)
        - Frontend (web UI)
        - CLI
        - Deployment (Docker/Compose)
        - Documentation
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / screenshots
      description: |
        Backend logs: `docker compose logs backend`
        Please redact any tokens, secrets, or personal data.
      render: shell

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `git rev-parse HEAD`, or the release version.

  - type: dropdown
    id: deployment
    attributes:
      label: How are you running MyACE?
      options:
        - Dev stack (docker-compose.dev.yml)
        - Single-machine prod (docker-compose.yml)
        - VPS behind a reverse proxy (docker-compose.prod.yml)
        - Something else
    validations:
      required: true
