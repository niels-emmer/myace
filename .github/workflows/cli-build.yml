name: Build CLI (latest)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build myace (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x86_64
            asset: myace-linux-x86_64
          - runner: macos-15-intel
            target: macos-x86_64
            asset: myace-macos-x86_64
          - runner: macos-latest
            target: macos-arm64
            asset: myace-macos-arm64
          - runner: windows-latest
            target: windows-x86_64
            asset: myace-windows-x86_64.exe

    defaults:
      run:
        working-directory: cli

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: cli/pyproject.toml

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Build binary with PyInstaller
        run: |
          pyinstaller build.spec --clean

      - name: Rename artifact
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/myace.exe dist/${{ matrix.asset }}
          else
            mv dist/myace dist/${{ matrix.asset }}
          fi

      - name: Generate checksum
        shell: bash
        run: |
          cd dist
          sha256sum ${{ matrix.asset }} > ${{ matrix.asset }}.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: cli/dist/${{ matrix.asset }}*

  publish-latest:
    name: Publish latest release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List downloaded assets
        run: ls -la dist/

      - name: Delete old latest release (if any)
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git push --delete origin latest 2>/dev/null || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create latest release with binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (${{ github.sha }})
          body: |
            Auto-built from `main` branch commit ${{ github.sha }}.

            These binaries are built on every push to `main` and may be less
            stable than tagged releases. For production use, prefer a
            [tagged release](https://github.com/niels-emmer/myace/releases).
          prerelease: true
          files: dist/*
          fail_on_unmatched_files: false
          generate_release_notes: false
