name: Release CLI

on:
  push:
    tags:
      - 'cli-v*'

permissions:
  contents: write

jobs:
  build:
    name: Build myace (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x86_64
            asset: myace-linux-x86_64
          - runner: macos-15-intel
            target: macos-x86_64
            asset: myace-macos-x86_64
          - runner: macos-latest
            target: macos-arm64
            asset: myace-macos-arm64
          - runner: windows-latest
            target: windows-x86_64
            asset: myace-windows-x86_64.exe

    defaults:
      run:
        working-directory: cli

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: cli/pyproject.toml

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Build binary with PyInstaller
        run: |
          pyinstaller build.spec --clean

      - name: Rename artifact
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/myace.exe dist/${{ matrix.asset }}
          else
            mv dist/myace dist/${{ matrix.asset }}
          fi

      - name: Generate checksum
        shell: bash
        run: |
          cd dist
          sha256sum ${{ matrix.asset }} > ${{ matrix.asset }}.sha256

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cli/dist/${{ matrix.asset }}
            cli/dist/${{ matrix.asset }}.sha256
          fail_on_unmatched_files: false
          generate_release_notes: false
